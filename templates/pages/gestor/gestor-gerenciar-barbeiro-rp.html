<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Funcionario | Agenda System</title>

    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/img/logos/favicon.png') }}">
    
    <style>
        .hidden-step { display: none !important; }
    </style>
</head>

<body class="bg-[#161513] text-[#f1efe8] font-sans min-h-screen flex p-4 sm:p-6 antialiased selection:bg-brand-gold selection:text-white overflow-x-hidden">
    
    <!-- Container Principal com paddings reduzidos -->
    <div class="w-full max-w-2xl m-auto bg-[#232220] border border-[#38362f] rounded-[14px] p-5 sm:p-6 shadow-xl">

        <!-- Stepper: margem inferior reduzida de mb-8 para mb-5 -->
        <ol class="flex mb-5 relative isolate" id="stepper">
            <!-- ETAPA 1 -->
            <li id="step-indicator-1" class="flex-1 flex flex-col items-center gap-1.5 relative text-[12px] before:content-[''] before:absolute before:top-[14px] before:-left-1/2 before:w-full before:h-[1px] before:bg-brand-gold before:z-0 first:before:content-none font-medium">
                <span class="relative z-10 w-[28px] h-[28px] rounded-full bg-brand-gold border border-brand-gold flex items-center justify-center text-[13px] font-bold text-black shadow-md shadow-brand-gold/30 transition-all">1</span>
                <span class="text-white font-bold transition-all">Dados do Barbeiro</span>
            </li>
        
            <!-- ETAPA 2 -->
            <li id="step-indicator-2" class="flex-1 flex flex-col items-center gap-1.5 relative text-[12px] text-brand-muted before:content-[''] before:absolute before:top-[14px] before:-left-1/2 before:w-full before:h-[1px] before:bg-brand-border before:z-0 transition-all">
                <span class="relative z-10 w-[28px] h-[28px] rounded-full bg-[#111215] border border-brand-border flex items-center justify-center text-[13px] font-medium text-brand-muted transition-all">2</span>
                <span class="text-brand-muted transition-all">Endereço</span>
            </li>
        </ol>

        <h1 id="form-title" class="text-center text-xl font-medium mb-1">Cadastrar Barbeiro</h1>
        <p id="form-subtitle" class="text-center text-[13px] text-[#888780] mb-4">Preencha os dados do profissional</p>

        <!-- Formulário: padding interno e margin inferior reduzidos -->
        <form id="form-profissional" class="bg-[#2a2825] border border-[#38362f] rounded-[14px] p-4 mb-4" novalidate>
            
            <!-- ETAPA 1: DADOS DO BARBEIRO (space-y reduzido) -->
            <div id="step-1" class="space-y-4">
                <div class="flex flex-col items-center justify-center gap-1.5">
                    <span class="text-[12px] font-medium text-[#888780]">Foto do Barbeiro</span>
                    <!-- Círculo da foto reduzido para w-20 h-20 -->
                    <label for="pro-foto" class="relative w-20 h-20 rounded-full border-2 border-dashed border-[#4a473f] bg-[#161513] flex flex-col items-center justify-center cursor-pointer transition-all hover:border-[#0f6e56] hover:bg-[#04342c] overflow-hidden group">
                        <span class="text-2xl text-[#888780] group-hover:text-[#9fe1cb] leading-none mb-1">+</span>
                        <span class="text-[10px] text-[#888780] group-hover:text-[#9fe1cb]">Upload</span>
                        <input type="file" id="pro-foto" accept="image/*" class="hidden">
                    </label>
                </div>
                
                <!-- Gaps do grid e inputs reduzidos -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1">
                        <label for="pro-cpf" class="text-[12px] font-medium text-[#888780]">CPF*</label>
                        <input type="text" id="pro-cpf" placeholder="000.000.000-00" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c] disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="pro-nome" class="text-[12px] font-medium text-[#888780]">Nome*</label>
                        <input type="text" id="pro-nome" placeholder="Nome do barbeiro" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="pro-email" class="text-[12px] font-medium text-[#888780]">Email*</label>
                        <input type="email" id="pro-email" placeholder="barbeiro@gmail.com" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="pro-telefone" class="text-[12px] font-medium text-[#888780]">Telefone*</label>
                        <input type="text" id="pro-telefone" placeholder="(00) 00000-0000" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="pro-senha" class="text-[12px] font-medium text-[#888780]">Senha*</label>
                        <input type="email" id="pro-senha" placeholder="********" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="pro-confirmar-senha" class="text-[12px] font-medium text-[#888780]">Confirmar Senha*</label>
                        <input type="text" id="pro-confirmar-senha" placeholder="********" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1 col-span-full">
                        <label for="pro-descricao" class="text-[12px] font-medium text-[#888780]">Descrição</label>
                        <textarea id="pro-descricao" placeholder="Especialidades e experiência..." rows="2" class="w-full p-2.5 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c] resize-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- ETAPA 2: ENDEREÇO -->
            <div id="step-2" class="space-y-4 hidden-step">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1 sm:col-span-1">
                        <label for="pro-cep" class="text-[12px] font-medium text-[#888780]">CEP*</label>
                        <input type="text" id="pro-cep" placeholder="00000-000" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex gap-3 col-span-full sm:col-span-1">
                        <div class="flex flex-col gap-1 flex-[3]">
                            <label for="pro-cidade" class="text-[12px] font-medium text-[#888780]">Cidade*</label>
                            <input type="text" id="pro-cidade" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                        </div>
                        <div class="flex flex-col gap-1 flex-[1]">
                            <label for="pro-uf" class="text-[12px] font-medium text-[#888780]">UF*</label>
                            <input type="text" id="pro-uf" maxlength="2" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] uppercase focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                        </div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="pro-bairro" class="text-[12px] font-medium text-[#888780]">Bairro*</label>
                        <input type="text" id="pro-bairro" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex gap-3 col-span-full sm:col-span-1">
                        <div class="flex flex-col gap-1 sm:col-span-2 w-full">
                            <label for="pro-logradouro" class="text-[12px] font-medium text-[#888780]">Logradouro*</label>
                            <input type="text" id="pro-logradouro" placeholder="Rua, Avenida..." autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                        </div>
                        <div class="flex flex-col gap-1 w-full">
                            <label for="pro-numero" class="text-[12px] font-medium text-[#888780]">Número*</label>
                            <input type="text" id="pro-numero" placeholder="123" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                        </div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="pro-complemento" class="text-[12px] font-medium text-[#888780]">Complemento</label>
                        <input type="text" id="pro-complemento" placeholder="Apto, Sala..." autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="pro-sequencia" class="text-[12px] font-medium text-[#888780]">Sequencia</label>
                        <input type="text" id="pro-sequencia" placeholder="Apto, Sala..." autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    
                </div>
            </div>
        </form>

        <div class="flex flex-col-reverse sm:flex-row justify-between gap-3">
            <button type="button" id="btn-voltar" class="h-10 px-4 rounded-[8px] border-none bg-transparent text-[#888780] text-[14px] hover:text-[#f1efe8] transition-colors hidden-step">Voltar</button>
            <div class="flex-1"></div>
            <!-- Botões -->
            <button type="button" id="btn-proximo" class="h-10 px-5 rounded-[8px] bg-brand-gold hover:bg-brand-gold-hover text-[#161513] text-[14px] font-semibold hover:opacity-90 active:scale-[0.98] transition-all">Próximo</button>
            <button type="button" id="btn-submit" class="h-10 px-5 rounded-[8px] bg-brand-gold hover:bg-brand-gold-hover text-[#161513] text-[14px] font-semibold hover:opacity-90 active:scale-[0.98] transition-all hidden-step">Cadastrar</button>
        </div>
    </div>

    <!-- Modal de Resumo -->
    <div class="hidden fixed inset-0 bg-black/65 z-[300] transition-opacity" id="overlay-resumo" onclick="fecharModalResumo()"></div>
    <div class="hidden fixed inset-0 z-[301] flex items-end sm:items-center justify-center sm:p-6 transition-all" id="modal-resumo">
        <div class="bg-[#232220] border border-[#4a473f] rounded-t-2xl sm:rounded-2xl p-5 w-full sm:max-w-md max-h-[85vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-base font-bold text-[#f1efe8]">Resumo do Cadastro</h2>
                <button type="button" class="w-7 h-7 rounded-full bg-[#2a2825] text-[#888780] hover:text-white text-xs flex items-center justify-center transition-colors" onclick="fecharModalResumo()">✕</button>
            </div>

            <!-- Dados Pessoais -->
            <div class="mb-4">
                <h3 class="text-[11px] font-bold text-brand-gold uppercase tracking-wider mb-2">Dados Pessoais</h3>
                <div class="bg-[#161513] rounded-xl border border-[#38362f] overflow-hidden">
                    <div class="flex gap-3 px-3 py-2 border-b border-[#38362f]">
                        <span class="text-sm w-5 flex items-center justify-center">👤</span>
                        <div><div class="text-[10px] text-[#888780]">Nome</div><div class="text-[13px] font-medium text-[#f1efe8]" id="resumo-nome">—</div></div>
                    </div>
                    <div class="flex gap-3 px-3 py-2 border-b border-[#38362f]">
                        <span class="text-sm w-5 flex items-center justify-center">🪪</span>
                        <div><div class="text-[10px] text-[#888780]">CPF</div><div class="text-[13px] font-medium text-[#f1efe8]" id="resumo-cpf">—</div></div>
                    </div>
                    <div class="flex gap-3 px-3 py-2 border-b border-[#38362f]">
                        <span class="text-sm w-5 flex items-center justify-center">📞</span>
                        <div><div class="text-[10px] text-[#888780]">Telefone</div><div class="text-[13px] font-medium text-[#f1efe8]" id="resumo-telefone">—</div></div>
                    </div>
                    <div class="flex gap-3 px-3 py-2">
                        <span class="text-sm w-5 flex items-center justify-center">✉️</span>
                        <div><div class="text-[10px] text-[#888780]">Email</div><div class="text-[13px] font-medium text-[#f1efe8]" id="resumo-email">—</div></div>
                    </div>
                </div>
            </div>

            <!-- Endereço -->
            <div class="mb-6">
                <h3 class="text-[11px] font-bold text-brand-gold uppercase tracking-wider mb-2">Endereço</h3>
                <div class="bg-[#161513] rounded-xl border border-[#38362f] overflow-hidden">
                    <div class="flex gap-3 px-3 py-2 border-b border-[#38362f]">
                        <span class="text-sm w-5 flex items-center justify-center">📍</span>
                        <div><div class="text-[10px] text-[#888780]">Logradouro e Número</div><div class="text-[13px] font-medium text-[#f1efe8]" id="resumo-logradouro">—</div></div>
                    </div>
                    <div class="flex gap-3 px-3 py-2 border-b border-[#38362f]">
                        <span class="text-sm w-5 flex items-center justify-center">🏘️</span>
                        <div><div class="text-[10px] text-[#888780]">Bairro e CEP</div><div class="text-[13px] font-medium text-[#f1efe8]" id="resumo-bairro-cep">—</div></div>
                    </div>
                    <div class="flex gap-3 px-3 py-2">
                        <span class="text-sm w-5 flex items-center justify-center">🌎</span>
                        <div><div class="text-[10px] text-[#888780]">Cidade/UF</div><div class="text-[13px] font-medium text-[#f1efe8]" id="resumo-cidade-uf">—</div></div>
                    </div>
                </div>
            </div>

            <!-- Ações -->
            <div class="flex flex-col gap-2">
                <button type="button" onclick="novoCadastro()" class="w-full h-10 rounded-[8px] bg-brand-gold hover:bg-brand-gold-hover text-black text-[14px] font-semibold hover:bg-[#f1efe8] hover:text-[#161513] active:scale-[0.98] transition-all">Novo cadastro</button>
                <button type="button" onclick="finalizarCadastro()" class="w-full h-10 rounded-[8px] border border-transparent hover:border-white text-[#888780] text-[14px] font-semibold hover:opacity-90 active:scale-[0.98] transition-all">Finalizar</button>
                <!-- <button type="button" onclick="fecharModalResumo()" class="w-full h-10 rounded-[8px] bg-transparent text-[#888780] text-[14px] hover:text-white transition-colors">Voltar e Editar</button> -->
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/gestor-gerenciar-barbeiro.js') }}"></script>
</body>
</html>
