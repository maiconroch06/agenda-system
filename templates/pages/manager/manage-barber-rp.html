<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Funcionario | Agenda System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/img/logos/favicon.png') }}">
    
    <style>
        .hidden-step { display: none !important; }
    </style>
</head>
<body class="bg-[#161513] text-[#f1efe8] font-sans min-h-screen flex items-center justify-center p-4 sm:p-8 antialiased selection:bg-[#0f6e56] selection:text-white">
    
    <!-- Container Principal Centralizado -->
    <div class="w-full max-w-3xl bg-[#232220] border border-[#38362f] rounded-[14px] p-6 sm:p-8 shadow-xl">

        <!-- Stepper -->
        <ol class="flex mb-8 relative isolate" id="stepper">
            <!-- ETAPA 1 (Inicialmente Ativa) -->
            <li id="step-indicator-1" class="flex-1 flex flex-col items-center gap-1.5 relative text-[12px] before:content-[''] before:absolute before:top-[14px] before:-left-1/2 before:w-full before:h-[1px] before:bg-brand-gold before:z-0 first:before:content-none font-medium">
                <span class="relative z-10 w-[28px] h-[28px] rounded-full bg-brand-gold border border-brand-gold flex items-center justify-center text-[13px] font-bold text-black shadow-md shadow-brand-gold/30 transition-all">1</span>
                <span class="text-white font-bold transition-all">Dados do Barbeiro</span>
            </li>
        
            <!-- ETAPA 2 (Inicialmente Inativa) -->
            <li id="step-indicator-2" class="flex-1 flex flex-col items-center gap-1.5 relative text-[12px] text-brand-muted before:content-[''] before:absolute before:top-[14px] before:-left-1/2 before:w-full before:h-[1px] before:bg-brand-border before:z-0 transition-all">
                <span class="relative z-10 w-[28px] h-[28px] rounded-full bg-[#111215] border border-brand-border flex items-center justify-center text-[13px] font-medium text-brand-muted transition-all">2</span>
                <span class="text-brand-muted transition-all">Endereço</span>
            </li>
        </ol>

        <h1 id="form-title" class="text-center text-2xl font-medium mb-1.5">Cadastrar Barbeiro</h1>
        <p id="form-subtitle" class="text-center text-[14px] text-[#888780] mb-6">Preencha os dados do profissional</p>

        <form id="form-profissional" class="bg-[#2a2825] border border-[#38362f] rounded-[14px] p-5 mb-5" novalidate>
            
            <!-- ETAPA 1: DADOS DO BARBEIRO -->
            <div id="step-1" class="space-y-6">
                <div class="flex flex-col items-center justify-center gap-2">
                    <span class="text-[13px] font-medium text-[#888780]">Foto do Barbeiro</span>
                    <label for="pro-foto" class="relative w-24 h-24 rounded-full border-2 border-dashed border-[#4a473f] bg-[#161513] flex flex-col items-center justify-center cursor-pointer transition-all hover:border-[#0f6e56] hover:bg-[#04342c] overflow-hidden group">
                        <span class="text-2xl text-[#888780] group-hover:text-[#9fe1cb] leading-none mb-1">+</span>
                        <span class="text-[11px] text-[#888780] group-hover:text-[#9fe1cb]">Upload</span>
                        <input type="file" id="pro-foto" accept="image/*" class="hidden">
                    </label>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label for="pro-cpf" class="text-[13px] font-medium text-[#888780]">CPF*</label>
                        <input type="text" id="pro-cpf" placeholder="000.000.000-00" autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c] disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="pro-nome" class="text-[13px] font-medium text-[#888780]">Nome*</label>
                        <input type="text" id="pro-nome" placeholder="Nome do barbeiro" autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="pro-email" class="text-[13px] font-medium text-[#888780]">Email*</label>
                        <input type="email" id="pro-email" placeholder="barbeiro@gmail.com" autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="pro-telefone" class="text-[13px] font-medium text-[#888780]">Telefone*</label>
                        <input type="text" id="pro-telefone" placeholder="(00) 00000-0000" autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1.5 col-span-full">
                        <label for="pro-descricao" class="text-[13px] font-medium text-[#888780]">Descrição</label>
                        <textarea id="pro-descricao" placeholder="Especialidades e experiência..." rows="2" class="p-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c] resize-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- ETAPA 2: ENDEREÇO -->
            <div id="step-2" class="space-y-6 hidden-step">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5 sm:col-span-1">
                        <label for="pro-cep" class="text-[13px] font-medium text-[#888780]">CEP*</label>
                        <input type="text" id="pro-cep" placeholder="00000-000" autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="pro-bairro" class="text-[13px] font-medium text-[#888780]">Bairro*</label>
                        <input type="text" id="pro-bairro" autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1.5 sm:col-span-2">
                        <label for="pro-logradouro" class="text-[13px] font-medium text-[#888780]">Logradouro*</label>
                        <input type="text" id="pro-logradouro" placeholder="Rua, Avenida..." autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="pro-numero" class="text-[13px] font-medium text-[#888780]">Número*</label>
                        <input type="text" id="pro-numero" placeholder="123" autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="pro-complemento" class="text-[13px] font-medium text-[#888780]">Complemento</label>
                        <input type="text" id="pro-complemento" placeholder="Apto, Sala..." autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                    </div>
                    
                    <div class="flex gap-4 col-span-full sm:col-span-1">
                        <div class="flex flex-col gap-1.5 flex-[3]">
                            <label for="pro-cidade" class="text-[13px] font-medium text-[#888780]">Cidade*</label>
                            <input type="text" id="pro-cidade" autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                        </div>
                        <div class="flex flex-col gap-1.5 flex-[1]">
                            <label for="pro-uf" class="text-[13px] font-medium text-[#888780]">UF*</label>
                            <input type="text" id="pro-uf" maxlength="2" autocomplete="off" class="h-11 px-3.5 rounded-[10px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[15px] uppercase focus:outline-none focus:border-[#0f6e56] focus:ring-3 focus:ring-[#04342c]">
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <div class="flex flex-col-reverse sm:flex-row justify-between gap-3">
            <button type="button" id="btn-voltar" class="h-10 px-4 rounded-[10px] border-none bg-transparent text-[#888780] text-[14px] hover:text-[#f1efe8] transition-colors hidden-step">← Voltar</button>
            <div class="flex-1"></div>
            <button type="button" id="btn-proximo" class="h-11 px-5 rounded-[10px] bg-[#f1efe8] text-[#161513] text-[14px] font-semibold hover:opacity-90 active:scale-[0.98] transition-all">Próxima Etapa →</button>
            <button type="button" id="btn-submit" class=" h-11 px-5 rounded-[10px] bg-[#f1efe8] text-[#161513] text-[14px] font-semibold hover:opacity-90 active:scale-[0.98] transition-all hidden-step">Cadastrar</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/barber-register.js') }}"></script>
</body>
</html>
