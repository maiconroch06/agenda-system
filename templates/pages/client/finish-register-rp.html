<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Importação do CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <title>TMS Barbearia - Carregando...</title>
</head>

<body class="min-h-dvh w-screen overflow-y-auto sm:overflow-hidden bg-[#161513] text-gray-100 font-sans antialiased flex items-center justify-center p-3 sm:p-6 md:p-8">

    <div id="tela-carregando" class="tela ativa w-full h-full flex items-center justify-center">

        <!-- Container Proporcional do Sistema -->
        <div class="w-full max-w-md sm:max-w-xl lg:max-w-2xl max-h-full flex flex-col justify-center my-auto">

            <!-- Card Principal -->
            <div class="w-full bg-[#1c1c1c] border border-brand-border rounded-2xl p-6 sm:p-8 lg:p-12 shadow-2xl flex flex-col items-center text-center">
                
                <!-- Logo Centralizada -->
                <div class="w-full flex items-center justify-center mb-6 sm:mb-8 shrink-0">
                    {% set logo_class="h-8 sm:h-11 lg:h-13" %}
                    {% include "componetization/logo/logo-top-horizontal.html" %}
                </div>

                <!-- Textos Informativos -->
                <div class="mb-6 sm:mb-8 shrink-0">
                    <h1 class="text-lg sm:text-xl lg:text-2xl font-bold text-white leading-snug">
                        Cadastro Realizado com Sucesso
                    </h1>
                    
                    <p class="text-xs sm:text-sm lg:text-base text-brand-muted mt-1.5 sm:mt-2">
                        Carregando serviços...
                    </p>
                </div>
                
                <!-- Bolinha de Carregamento (Spinner) -->
                <div class="w-10 h-10 sm:w-12 sm:h-12 border-4 border-brand-border border-t-brand-gold rounded-full animate-spin my-2"></div>
                
            </div>

        </div>

    </div>

    <!-- Script de Redirecionamento Automático após 3 segundos -->
    <script>
        setTimeout(() => {
            window.location.href = "/cliente/agendamentos";
        }, 3000);
    </script>

</body>
</html>
