<!-- BOTÃO DO CLIENTE -->
<button id="btn-usuario" class="flex items-center justify-center" type="button">
    <div class="w-10 h-10 shrink-0 rounded-full bg-[#38362f] flex items-center justify-center overflow-hidden hover:bg-[#2c2b27] transition-all cursor-pointer">

        <!-- FOTO DO USUÁRIO -->
        {% if session.get('dados_cliente') and session.get('dados_cliente').get('foto_path') %}
            <img class="w-full h-full object-cover">
                src="{{ url_for('static', filename=session.get('dados_cliente')['foto_path']) }}" alt="Avatar"
        {% else %}
            <span class="text-sm font-bold text-[#f1efe8]">
                {{ session.get('dados_cliente')['nome_completo'][0]|upper }}
            </span>
        {% endif %}
    </div>

    <!-- SETA PARA BAIXO (Icone) -->
    {% include "componetizacao/icones/icone-seta-baixo.html" %}
    
</button>
        
<!-- DROPDOWN DO CLIENTE -->
{% include "componetizacao/Dropdowns/dropdown-cliente.html" %}
