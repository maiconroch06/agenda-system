{# HEADER principal (páginas públicas): logo + NavBar + ações. No mobile a NavBar vira menu suspenso. #}
<header id="site-header" class="fixed inset-x-0 top-0 z-50 border-b border-[#222222] bg-[#0a0a0a]/90 backdrop-blur-md transition-shadow duration-300">
    <div class="relative mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-5 sm:h-[72px]">

        {% include "componetizacao/logo/logo-top-horizontal.html" %}
        {% include "componetizacao/NavBar/nav-bar-center.html" %}

        <div class="flex items-center gap-2 sm:gap-4">
            <a href="/tipo-usuario" class="hidden items-center gap-2 text-xs font-semibold text-amber-100 transition-colors hover:text-amber-200 lg:inline-flex">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
                Acesso Restrito
            </a>

            <a href="/cliente/login" aria-label="Agendar Horário"
                class="rounded bg-brand-gold px-4 py-2.5 text-xs font-semibold uppercase tracking-wider text-black shadow-md transition-all duration-300 hover:bg-brand-gold-hover hover:shadow-brand-gold/20 sm:px-5">
                Agendar<span class="hidden sm:inline">&nbsp;Horário</span>
            </a>

            <button id="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Abrir menu"
                class="inline-flex h-10 w-10 items-center justify-center rounded border border-[#222222] text-gray-200 transition-colors hover:text-brand-gold lg:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="hidden h-5 w-5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
</header>

<script>
(() => {
    const btn = document.getElementById('nav-toggle'),
          nav = document.getElementById('site-nav'),
          bar = document.getElementById('site-header'),
          icons = btn.querySelectorAll('svg');
    const setOpen = open => {
        nav.classList.toggle('hidden', !open);
        btn.setAttribute('aria-expanded', open);
        btn.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
        icons[0].classList.toggle('hidden', open);
        icons[1].classList.toggle('hidden', !open);
    };
    btn.addEventListener('click', () => setOpen(btn.getAttribute('aria-expanded') !== 'true'));
    nav.addEventListener('click', e => e.target.closest('a') && setOpen(false));
    document.addEventListener('keydown', e => e.key === 'Escape' && setOpen(false));
    addEventListener('scroll', () => bar.classList.toggle('shadow-lg', scrollY > 8), { passive: true });
})();
</script>
