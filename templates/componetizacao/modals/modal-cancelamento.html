<dialog id="janela_modal_motivo_cancelamento"
    class="fixed inset-2 sm:inset-4 md:inset-8 w-auto h-auto lg:mx-40 lg:my-10 max-h-[calc(100dvh-1rem)] overflow-y-auto overflow-x-hidden rounded-xl border-0 bg-transparent p-0 shadow-xl backdrop:bg-black/50
    [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">

        <!-- Container externo -->
        <div class="w-full max-w-2xl m-auto bg-[#232220] border border-[#38362f] rounded-[14px] p-5 sm:p-6 shadow-xl">

            <!-- Logo -->
            <div class="w-full flex items-center justify-center mb-4 md:mb-6 shrink-0">
                {% set logo_class="h-20 sm:h-20 md:h-24" %}
                {% include "componetizacao/logo/logo-top-horizontal.html" %}
            </div>

            <!-- Mensagens de erro ocultas por padrão -->
            <div id='div-validation-message'
                 class="bg-red-500/10 border border-red-500/30 mb-8 text-red-500 text-xs sm:text-sm p-3 rounded-lg text-center font-medium tracking-wide hidden">
                 <p id="validation-menssage"></p>
            </div>

            <h1 id="form-title" class="text-center text-xl font-semibold mb-1 text-white">Cancelar Agendamento</h1>
            <p id="form-subtitle" class="text-center text-[13px] text-[#888780] mb-4">Informe o motivo do cancelamento</p>
                    
            <!-- Formulário -->
            <form id="form-cancelamento" class="bg-[#2a2825] border border-[#38362f] rounded-[14px] p-4 mb-4" 
                method="POST" action="" novalidate>
                
                <div class="flex flex-col gap-1">
                    <label for="motivo-cancelamento" class="text-[12px] font-medium text-[#888780]">Motivo*</label>
                    <textarea name="motivo" id="motivo-cancelamento" placeholder="Descreva brevemente o motivo do cancelamento..." rows="4" class="w-full p-2.5 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c] resize-none" required></textarea>
                </div>

                <div class="flex flex-col-reverse mt-6 sm:flex-row justify-between gap-3">
                    <button type="button" onclick="fecharModalCancelamento()" class="h-10 px-4 border-none bg-transparent text-[#888780] text-[14px] hover:text-[#f1efe8] transition-colors">Voltar</button>
                    <button type="submit" name="status" value=motivo class="h-10 px-5 bg-brand-gold hover:bg-brand-gold-hover text-[#161513] text-[14px] font-semibold hover:opacity-90 active:scale-[0.98] transition-all rounded-[8px]">Confirmar Cancelamento</button>
                </div>
            </form>

        </div>
</dialog>
