<!-- MODAL: BLOQUEIO DE HORÁRIO - Deve ser ATUALIZADO -->
<dialog
    id="janela_modal_cadastrar_editar_faltas_justificadas_barbeiro"
    class="fixed inset-2 sm:inset-4 md:inset-8 w-auto h-auto lg:mx-40 lg:my-10 max-h-[calc(100dvh-1rem)] 
    overflow-y-auto overflow-x-hidden rounded-xl border-0 bg-transparent p-0 shadow-xl backdrop:bg-black/50
    [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
    
    
    <div class="fixed inset-0 z-301 flex items-end sm:items-center justify-center sm:p-6" id="modal-bloquear">
    <div class="bg-[#232220] border border-[#4a473f] rounded-t-2xl sm:rounded-2xl p-5 w-full sm:max-w-md max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">

                <h2 id="titulo_modal_faltas_justificadas" class="text-base font-semibold text-white"></h2>
                <!-- Mensagens -->
                
                <button id="fechar-modal-falta-justificada"
                    class="w-7 h-7 rounded-full bg-[#2a2825] text-[#888780] text-xs flex items-center justify-center"
                    >{% include "componetizacao/icones/icone-X.html" %}
                </button>
        </div>
            <div id='div_validation_message_falta_justificada'
                        class="bg-red-500/10 border border-red-500/30 mb-8 text-red-500 text-xs sm:text-sm p-3 rounded-lg text-center font-medium tracking-wide hidden ">
                        <p id="validation_menssage_falta_justificada"></p>
                </div>    
            <form id="form_faltas_justificadas" action="" class="flex flex-col gap-3" method="post">
                <input type="hidden" id="id_barbeiro_falta" name="id_barbeiro_falta" >
                <input type="hidden" id="id_falta_justificativa" name="id_falta_justificativa" >
               
                
                <label class="text-xs font-medium text-[#888780]" for="bloq-barbeiro">Barbeiro</label>
                <input type="text" id="nome_barbeiro_falta" name="nome_barbeiro_falta"  readonly  class="text-amber-400 rounded border border-amber-400 py-2 pl-3">
                    
             
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-[#888780]" for="bloq-data">Data</label>
                    <input type="date" name="data_falta" id="data_falta" style="color-scheme: dark;" class="w-full h-10 px-3  rounded-lg border border-[#4a473f] bg-[#161513] text-white text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c] transition-all">           
                </div>
                
                <div class="flex justify-between">
                    <div class="flex flex-col gap-1">
                        
                        <label class="text-xs font-medium text-[#888780]" for="bloq-inicio">Início</label>
                        <input id="hora_inicio_falta"  name="hora_inicio_falta" value="08:00" class="text-white h-10 px-3 rounded-lg border border-[#4a473f] bg-[#161513] focus:outline-none cursor-pointer " type="time" style="color-scheme: dark;">
                           
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-medium text-[#888780]" for="bloq-fim">Fim</label>
                        <input id="hora_fim_falta" name="hora_fim_falta" value="12:00" class="text-white h-10 px-3 rounded-lg border border-[#4a473f] bg-[#161513] focus:outline-none cursor-pointer " type="time" style="color-scheme: dark;">
                    </div>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-[#888780]" for="bloq-motivo">Motivo *</label>
                    <textarea rows="5" id="motivo_falta_justificada"  name="motivo_falta_justificada" placeholder="Ex: Doente"
                    class="h-10 px-3 rounded-lg border border-[#4a473f] bg-[#161513] text-white text-sm focus:outline-none"></textarea>
                    <small class="mt-2 text-[10px] font-normal text-amber-200" for="bloq-motivo">Esse motivo vai aparecer aos clientes com justificativa para o cancelamento do agendamento dele caso exista agendamentos para essa data e horário </small>
                </div>
                <button type="submit" id="cadastrar-editar-falta"
                    class="w-full h-10 px-4 rounded-lg bg-[#f1efe8] text-[#161513] hover:bg-[#cac9c4] font-semibold text-sm cursor-pointer mt-2"
                    >Bloquear horário
                </button>
                <button type="button" id="fechar_modal_falta_justificada"
                    class="w-full h-10 px-4 rounded-lg border border-[#4a473f] bg-transparent text-white font-normal hover:border-0  hover:bg-[#1b1b19]  text-sm cursor-pointer mt-2"
                    >Fechar
                </button>
            </form>
    </div>


</dialog>
