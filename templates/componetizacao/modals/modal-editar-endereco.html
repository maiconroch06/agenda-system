<dialog
    id="janela_modal_cadastrar_editar_endereco"
    class="fixed inset-2 sm:inset-4 md:inset-8 w-auto h-auto lg:mx-40 lg:my-10 max-h-[calc(100dvh-1rem)] overflow-y-auto overflow-x-hidden rounded-xl border-0 bg-transparent p-0 shadow-xl backdrop:bg-black/50
    [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">

    <!-- Container externo -->
    <div class="w-full max-w-2xl m-auto bg-[#232220] border border-[#38362f] rounded-[14px] p-5 sm:p-6 shadow-xl">

       
        <div class="w-full flex items-center justify-center mb-4 md:mb-6 shrink-0">
            {% set logo_class="h-20 sm:h-20 md:h-24" %}
            {% include "componetizacao/logo/logo-top-horizontal.html" %}
        </div>

        <h1  class="text-center font-normal text-xl  mb-1 text-white">Editar endereco de <span id="form-title-endereco" class="text-amber-300"></span></h1>
        <p id="form-subtitle" class="text-center text-[13px] text-[#888780] mb-4">Preencha os dados do profissional</p>

            
              <!-- Mensagens -->
            <div id='exibir-menssagem-erros-endereco'
                    class="bg-red-500/10 border border-red-500/30 mb-8 text-red-500 text-xs sm:text-sm p-3 rounded-lg text-center font-medium tracking-wide hidden ">
                    <p id="menssagem-erros-endereco"></p>
            </div>

          <!-- Formulário: padding interno e margin inferior reduzidos -->
        <form id="form-endereco-barbeiro" class="bg-[#2a2825] border border-[#38362f] rounded-[14px] p-4 mb-4" action="/gestor/painel/barbeiro/endereco/editar"  method="post" enctype="multipart/form-data" novalidate>
            
             <input type="hidden" id="bab-end-id" name="bar-end-id" value="">

               <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1 sm:col-span-1">
                        <label for="bar-end-cep" class="text-[12px] font-medium text-[#888780]">CEP*</label>
                        <input type="text" name="cep" id="bar-end-cep" value="00000-000" maxlength="9" placeholder="00000-000" autocomplete="off" class="w-full h-10 px-3 border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex gap-3 col-span-full sm:col-span-1">
                        <div class="flex flex-col gap-1 flex-[3]">
                            <label for="bar-end-cidade" class="text-[12px] font-medium text-[#888780]">Cidade*</label>
                            <input type="text" name="cidade" id="bar-end-cidade" value="Nova Cruz" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                        </div>
                        <div class="flex flex-col gap-1 flex-[1]">
                            <label for="bar-end-uf" class="text-[12px] font-medium text-[#888780]">UF*</label>
                            <input type="text" name="unidade-federativa" value="RN" id="bar-end-uf" maxlength="2" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] uppercase focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                        </div>
                    </div>
                    <div class="flex flex-col gap-1 sm:col-span-2 w-full">
                            <label for="bar-end-logradouro" class="text-[12px] font-medium text-[#888780]">Logradouro*</label>
                            <input type="text" name="logradouro" id="bar-end-logradouro" value="Logrinho" placeholder="Rua, Avenida..." autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                        </div>
                    
                   <div class="col-span-1 sm:col-span-2 grid grid-cols-2 gap-3 w-full">
                        <div class="flex flex-col gap-1 min-w-0">
                            <label for="bar-end-numero" class="text-[12px] font-medium text-[#888780]">Número*</label>
                            <input type="text" name="numero" id="bar-end-numero" value="123" placeholder="123" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                        </div>

                        <div class="flex flex-col gap-1 min-w-0">
                            <label for="bar-end-bairro" class="text-[12px] font-medium text-[#888780]">Bairro*</label>
                            <input type="text" name="bairro" id="bar-end-bairro" value="Bairro" autocomplete="off" class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                        </div>
                    </div>
                    <div class="flex flex-col gap-3">
                        <label for="bar-end-complemento" class="text-[12px] font-medium text-[#888780]">Complemento</label>
                        <input type="text" name="complemento" id="bar-end-complemento" value="Sala" placeholder="Apto, Sala..." autocomplete="off" class="w-full h-10 px-3  border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    <div class="flex flex-col gap-3">
                        <label for="bar-end-sequencia" class="text-[12px] font-medium text-[#888780]">Sequencia</label>
                        <input type="text" name="sequencia" id="bar-end-sequencia" value="123" placeholder="1, 2, A, B, ." autocomplete="off" class="w-full h-10 px-3  border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-[#0f6e56] focus:ring-2 focus:ring-[#04342c]">
                    </div>
                    
                </div>

            <div class="flex flex-col-reverse mt-6 sm:flex-row justify-between gap-3">
                <button type="button" id="btn-cancelar-endereco" class="h-10 px-4  border-none bg-transparent text-[#888780] text-[14px] hover:text-[#f1efe8] transition-colors">Cancelar</button>
                <!-- Botões -->
                <button type="submit"  class="h-10 px-5  bg-brand-gold hover:bg-brand-gold-hover text-[#161513] text-[14px] font-semibold hover:opacity-90 active:scale-[0.98] transition-all">Atualizar endereço</button>
            </div>
        </form>      

    </div>
</dialog>
