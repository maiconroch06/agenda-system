<div id="dropdown-usuario" hidden
    class="absolute right-0 top-12 w-56 bg-[#232220] border border-[#38362f] rounded-xl shadow-2xl overflow-hidden z-50">

    <!-- DADOS DO BARBEIRO -->
    <div class="px-4 py-3 border-b border-[#38362f]">

        <p class="text-sm font-medium text-[#f1efe8]">
            { if session.get('dados_barbeiro') %}
            { session.get('dados_barbeiro')['nome_completo'] }}
            { endif %}
        </p>

        <p class="text-xs text-[#888780] mt-1">
            Minha conta
        </p>

    </div>

    <!-- SAIR -->
    <a href="/barbeiro/logout"
        class="block px-4 py-3 text-sm text-red-400 hover:bg-red-500/10 transition-colors">
        Sair
    </a>

</div>

<!-- CONTROLE DO DROPDOWN -->
<script>
    const btnUsuario = document.getElementById('btn-usuario');
    const dropdownUsuario = document.getElementById('dropdown-usuario');
    const setaUsuario = document.getElementById('seta-usuario');

    // Abrir e Fechar
    btnUsuario.addEventListener('click', function (event) {
        event.stopPropagation();
        dropdownUsuario.hidden = !dropdownUsuario.hidden;

        // Rotaciona a seta
        if (dropdownUsuario.hidden) {
            setaUsuario.classList.remove('rotate-180');
        } else {
            setaUsuario.classList.add('rotate-180');
        }
    });

    // Fechar ao clicar fora
    document.addEventListener('click', function (event) {
        if (!btnUsuario.contains(event.target) && !dropdownUsuario.contains(event.target)) {
            dropdownUsuario.hidden = true;
            setaUsuario.classList.remove('rotate-180');
        }
    });
</script>
