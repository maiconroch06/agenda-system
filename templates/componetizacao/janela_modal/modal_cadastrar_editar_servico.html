
<dialog
    id="janela_modal_editar_servico"
    class="fixed inset-0 m-auto w-0.5  max-h-[90vh] overflow-y-auto rounded-xl border-0 bg-transparent p-0 shadow-xl backdrop:bg-black/50">

    <!-- Container externo -->
    <div class="bg-[#161513] text-[#f1efe8] font-sans p-4 sm:p-6 antialiased">

        <!-- Container principal -->
        <div class="w-full bg-[#232220] border border-[#38362f] rounded-[14px] p-5 sm:p-6 shadow-xl">

            <!-- Logo -->
            <div class="w-full flex items-center justify-center mb-4 md:mb-6">
                {% set logo_class="h-10 sm:h-12 md:h-14" %}
                {% include "componetizacao/logo/logo-top-horizontal.html" %}
            </div>

            <h1 id="form-title" class="text-center text-xl font-medium mb-1">
                Cadastrar Serviço
            </h1>

            <p id="form-subtitle" class="text-center text-[13px] text-[#888780] mb-5">
                Preencha os dados do serviço para disponibilizar no agendamento
            </p>

            <!-- Mensagens -->
            <div id='div-validation-message'
                    class="bg-red-500/10 border border-red-500/30 mb-8 text-red-500 text-xs sm:text-sm p-3 rounded-lg text-center font-medium tracking-wide hidden ">
                    <p id="validation-menssage"></p>
            </div>
            <!-- Formulário -->
            <form
                class="w-full bg-[#2a2825] border border-[#38362f] rounded-[14px] p-4"
                method="post"
                id="form-servico"
                action=""
                enctype="multipart/form-data">
                        
                <input
                        type="hidden"
                        id="srv-foto_nome_anterior"
                        name="srv-foto_nome_anterior"
                        value="">

                    <input
                        type="hidden"
                        id="srv-id"
                        name="srv-id"
                        value="">
               

                <div class="space-y-4">

                    <!-- Upload de imagem -->
                    <div class="flex flex-col items-center justify-center gap-1.5">

                        <span class="text-[12px] font-medium text-[#888780]">
                            Imagem do Serviço
                        </span>

                        <label for="srv-foto"
                            class="relative w-32 h-32 rounded-2xl border-2 border-dashed border-[#4a473f] bg-[#161513] flex flex-col items-center justify-center cursor-pointer transition-all hover:border-brand-gold-hover overflow-hidden group">

                            <img
                                id="img_srv-preview"
                                class="hidden absolute inset-0 w-full h-full object-contain"
                                src=""
                                alt="Pré-visualização da imagem">

                            <span class="text-2xl text-[#888780] group-hover:text-brand-gold leading-none mb-1">
                                {% include "componetizacao/icones/icone-servico.html" %}
                            </span>

                            <span class="text-[10px] text-[#888780] group-hover:text-brand-gold">
                                Selecionar imagem
                            </span>

                            <input
                                id="srv-foto"
                                type="file"
                                name="srv-imagem"
                                accept="image/*"
                                class="hidden">
                        </label>

                        <div id="butao-remover-imagem"></div>    
                        </div>
                    </div>

                    <!-- Inputs do serviço -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                        <div class="flex flex-col gap-1 col-span-full">
                            <label for="srv-nome" class="text-[12px] font-medium text-[#888780]">
                                Nome do Serviço*
                            </label>

                            <input
                                class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-brand-gold-hover focus:ring-2 focus:ring-brand-gold"
                                type="text"
                                id="srv-descricao-servico"
                                name="srv-descricao-servico"
                                value=""
                                placeholder="Ex: Corte Degradê + Barba"
                                autocomplete="off">
                        </div>

                        <div class="flex flex-col gap-1">
                            <label for="srv-preco" class="text-[12px] font-medium text-[#888780]">
                                Valor do servico (R$)*
                            </label>

                            <input
                                class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-brand-gold-hover focus:ring-2 focus:ring-brand-gold"
                                type="text"
                                id="srv-valor"
                                name="srv-valor"
                                value=""
                                placeholder="R$ 0,00"
                                autocomplete="off">
                        </div>

                        <div class="flex flex-col gap-1">
                            <label for="srv-duracao" class="text-[12px] font-medium text-[#888780]">
                                Duração (min)*
                            </label>

                            <input
                                class="w-full h-10 px-3 rounded-[8px] border border-[#4a473f] bg-[#161513] text-[#f1efe8] text-[14px] focus:outline-none focus:border-brand-gold-hover focus:ring-2 focus:ring-brand-gold"
                                type="text"
                                id="srv-duracao"
                                name="srv-duracao"
                                value=""
                                placeholder="Ex: 45 min"
                                autocomplete="off">
                        </div>

                       
                            <div id="div-seletor-status" class="flex flex-col gap-1">
                                <label for="srv-status" class="text-[12px] font-medium text-[#888780]">
                                    Status do serviço:
                                </label>

                                <select
                                    id="srv-status"
                                    name="srv-status"
                                    class="text-[12px] text-amber bg-[#161513] border border-[#4a473f] rounded-lg p-2">

                                    <option id="ativado" value="1">
                                        Ativado
                                    </option>

                                    <option id="desativado" value="0">
                                        Desativado
                                    </option>
                                </select>
                            </div>
                      

                    </div>

                    <!-- Botões -->
                    <div class="flex justify-between mt-4">

                        <button
                            type="button"
                            id="fechar-modal-editar"
                            class="h-10 px-4 rounded-[8px] bg-transparent text-[#888780] text-[14px] hover:text-[#f1efe8] transition-colors">
                            Cancelar
                        </button>

                        <button
                            id="botao-cadastrar-editar"
                            class="h-10 px-5 rounded-[8px] bg-brand-gold hover:bg-brand-gold-hover text-[#161513] text-[14px] font-semibold hover:opacity-90 active:scale-[0.98] transition-all"
                            type="submit">
                            
                        </button>

                    </div>

                </div>
            </form>
        </div>
    </div>
</dialog>

<!-- Scripts -->
<script  type="module" src="{{ url_for('static', filename='js/validacoes/exibir-imagem-servico.js') }}"></script>
