<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Agenda System</title>
  
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>

<!-- ============================================================
     TELA 1: AUTENTICAÇÃO (Login / Cadastro)
     ============================================================ -->
    <div id="tela-auth" class="tela ativa">
        <div class="auth-container">
            <div class="auth-abas">
                <a href="/" class="logo">
                <div class="logo-icon">A</div>
                <span>Agenda System</span>
                </a>
            </div>
            
            <!-- Login -->
            <form id="form-login" class="form-auth" action="{{ url_for('auth.login') }}" method="POST" novalidate>
                <div class="campo">
                    <label for="login-usuario">Usuário ou e-mail</label>
                    <input type="text" id="login-usuario" name="all-authentication-usuario" placeholder="Digite seu usuário ou e-mail" autocomplete="off">
                    <span class="campo__erro" id="erro-login-usuario"></span>
                </div>
                <div class="campo">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" name="all-authentication-senha" placeholder="Digite sua senha">
                    <span class="campo__erro" id="erro-login-senha"></span>
                </div>
                  <div class="campo">
                        <a class="btn-ghost" href="/panel-categoria-do-usuario">Esqueci minha senha?</a>
                    <span class="campo__erro" id="erro-login-senha"></span>
                </div>
                        <!-- tem que validar o tipo usuario para envaminha para tela certa -->
                         <!-- onclick="fazerLogin()" -->
                <button type="submit" class="btn-primario">Entrar</button>
            </form>
  
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/autenticacao.js') }}"></script>
</body>
</html>
